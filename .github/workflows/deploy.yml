name: CI/CD Deploy to CyberPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: CI (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

  deploy:
    name: Deploy to CyberPanel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing VPS_USER"
          [ -n "$VPS_PASSWORD" ] || missing="$missing VPS_PASSWORD"
          [ -n "$VPS_PATH" ] || missing="$missing VPS_PATH"
          if [ -n "$missing" ]; then
            echo "Missing GitHub Actions secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Sync code to server
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass
          ok=""
          for i in 1 2 3 4 5; do
            if sshpass -p "${{ secrets.VPS_PASSWORD }}" rsync -az --delete \
              -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15" \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude 'node_modules/' \
              --exclude '.next/' \
              --exclude '.env' \
              --exclude '.env.*' \
              --exclude 'public/uploads/' \
              --exclude '*.log' \
              --exclude 'tsconfig.tsbuildinfo' \
              ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"; then
              ok=1
              break
            fi
            echo "rsync attempt $i failed, retrying in 20s..."
            sleep 20
          done
          [ -n "$ok" ] || { echo "rsync failed after 5 attempts"; exit 1; }

      - name: Build, migrate, and restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: "30m"
          script: |
            set -e
            cd "${{ secrets.VPS_PATH }}"
            if [ -f .env.production ]; then
              set -a
              . ./.env.production
              set +a
            elif [ -f .env ]; then
              set -a
              . ./.env
              set +a
            else
              echo 'Missing .env.production or .env on the deployment server.'
              exit 1
            fi
            export NODE_ENV=production
            [ -n "$DATABASE_URL" ] || { echo 'DATABASE_URL is missing from the server environment file.'; exit 1; }
            [ -n "$SESSION_SECRET" ] || { echo 'SESSION_SECRET is missing from the server environment file.'; exit 1; }
            npm ci
            npm run build
            npx drizzle-kit push --force
            if pm2 describe psmo >/dev/null 2>&1; then
              pm2 restart psmo --update-env
            else
              pm2 start npm --name psmo -- start
            fi
            pm2 save

      - name: Public health check
        run: |
          curl -sf --retry 6 --retry-delay 10 --retry-all-errors "https://${{ secrets.VPS_HOST }}/api/health" \
            || { echo "Public domain health check failed"; exit 1; }
          echo "App is healthy."
