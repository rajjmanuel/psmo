name: Deploy PSMO to CyberPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: psmo-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USERNAME" ] || missing="$missing DEPLOY_USERNAME"
          [ -n "$DEPLOY_PASSWORD" ] || missing="$missing DEPLOY_PASSWORD"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          if [ -n "$missing" ]; then
            echo "Missing GitHub Actions secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Upload application files
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "package.json,package-lock.json,next.config.ts,postcss.config.mjs,tsconfig.json,drizzle.config.ts,drizzle,public,src"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false

      - name: Install, migrate, build, and restart
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PM2_NAME: ${{ secrets.DEPLOY_PM2_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          envs: DEPLOY_PATH,PM2_NAME
          script: |
            set -e
            cd "$DEPLOY_PATH"
            if [ -f .env.production ]; then
              set -a
              . ./.env.production
              set +a
            elif [ -f .env ]; then
              set -a
              . ./.env
              set +a
            else
              echo 'Missing .env.production or .env on the deployment server.'
              exit 1
            fi
            export NODE_ENV=production
            [ -n "$DATABASE_URL" ] || { echo 'DATABASE_URL is missing from the server environment file.'; exit 1; }
            [ -n "$SESSION_SECRET" ] || { echo 'SESSION_SECRET is missing from the server environment file.'; exit 1; }
            npm ci --include=dev
            npx drizzle-kit push --force
            npm run build
            if [ -n "$PM2_NAME" ]; then
              pm2 restart "$PM2_NAME" --update-env
            elif pm2 describe psmo >/dev/null 2>&1; then
              pm2 restart psmo --update-env
            else
              pm2 start npm --name psmo -- start
            fi
            pm2 save
